# Sprachassistent selbst hosten: cp .env.example .env, Werte setzen, docker compose up -d --build
# Adminbereich auf http://<rechner> (bzw. https://<SITE>), das erste Konto wird Admin.
name: sprachassistent

x-env: &env
  DATABASE_URL: postgres://sprachassistent:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/sprachassistent
  CREDENTIALS_KEY: ${CREDENTIALS_KEY:?CREDENTIALS_KEY in .env setzen}
  VOICE_URL: http://voice:3020
  SEARXNG_URL: http://searxng:8080

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sprachassistent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: pg_isready -U sprachassistent
      interval: 5s
      retries: 20

  # Migriert die Datenbank beim Start; Konten, ESP-Schluessel, Adminbereich
  web:
    build: { context: ., dockerfile: deployments/docker/Dockerfile, target: web }
    restart: unless-stopped
    environment: *env
    depends_on:
      db: { condition: service_healthy }

  # Spracherkennung, KI, Sprachausgabe; startet erst, wenn die Migrationen da sind (sonst Neustart)
  voice:
    build: { context: ., dockerfile: deployments/docker/Dockerfile, target: voice }
    restart: unless-stopped
    environment: *env
    volumes: [models:/app/models]
    # Dockers Standardprofil plus clone/unshare/setns: die Sandbox von Chromium (Seiten mit JavaScript)
    # braucht User-Namespaces; ohne sie liefe Chromium nur mit --no-sandbox.
    security_opt: [seccomp=deployments/docker/seccomp-chromium.json]
    depends_on: [web]

  searxng:
    image: searxng/searxng:2026.10.27-b5ed73fcb
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${CREDENTIALS_KEY}
    volumes: [./deployments/pi/searxng/settings.yml:/etc/searxng/settings.yml:ro]

  proxy:
    build: { context: ., dockerfile: deployments/docker/Dockerfile, target: proxy }
    restart: unless-stopped
    environment:
      SITE: ${SITE:-:80}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes: [caddy:/data]
    depends_on: [web, voice]

volumes:
  db:
  models:
  caddy:
