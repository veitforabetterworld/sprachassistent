[package]
name = "sprachassistent"
version = "0.1.0"
edition = "2021"
description = "Sprachassistent mit Persoenlichkeit und Gedaechtnis: ESP32 als Mikrofon/Lautsprecher, Server auf dem Raspberry Pi"
publish = false

[features]
default = ["speech"]
# Live-Spracherkennung (Kroko, streaming) und Piper-Stimmen ueber sherpa-onnx
# (vorgebaute Bibliothek, liegt in bin/lib)
speech = ["dep:sherpa-onnx"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dotenvy = "0.15"
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "derive"] }
aes-gcm = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time", "io-util", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

# 2.x dropped espeak-ng for Piper voices (they then need an external phonemizer); 1.13 still has it.
sherpa-onnx = { version = "=1.13.8", optional = true, default-features = false, features = ["shared"] }
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
