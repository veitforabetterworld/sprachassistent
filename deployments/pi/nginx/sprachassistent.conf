# sprachassistent.plenivo.de on the Raspberry Pi. Static admin web from /var/www/sprachassistent/app;
# /v1/talk and /v1/health go to the Rust voice server (127.0.0.1:3020), the rest of /v1 to the Node web API
# (127.0.0.1:3022). /internal of the voice server is never forwarded.
# Certificate: certbot certonly --authenticator dns-desec -d sprachassistent.plenivo.de

upstream sprachassistent_voice {
  server 127.0.0.1:3020;
  keepalive 8;
}

upstream sprachassistent_web {
  server 127.0.0.1:3022;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name sprachassistent.plenivo.de;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name sprachassistent.plenivo.de;

  ssl_certificate     /etc/letsencrypt/live/sprachassistent.plenivo.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sprachassistent.plenivo.de/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;

  root /var/www/sprachassistent/app;
  index index.html;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # add_header on location level replaces the server level, so every location includes the headers.
  location = /v1/talk {
    include /etc/nginx/snippets/sprachassistent-headers.conf;
    # Recordings are at most ~20 s (under 1 MB); WAV uploads for tests may be larger.
    client_max_body_size 12m;
    # The reply is spoken sentence by sentence; buffering would hold it back until the end.
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://sprachassistent_voice;
  }

  location = /v1/health {
    include /etc/nginx/snippets/sprachassistent-headers.conf;
    proxy_pass http://sprachassistent_voice;
  }

  location /v1/ {
    include /etc/nginx/snippets/sprachassistent-headers.conf;
    client_max_body_size 1m;
    # Test chat and voice preview wait for the AI.
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_pass http://sprachassistent_web;
  }

  location /assets/ {
    include /etc/nginx/snippets/sprachassistent-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/sprachassistent-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }
}
