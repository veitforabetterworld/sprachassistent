# sprachassistent.plenivo.de on the Raspberry Pi: pure API, everything goes to the server under PM2
# on 127.0.0.1:3020 (3000 plenivo, 3001 hochwasserdienst).
# Certificate: certbot certonly --authenticator dns-desec -d sprachassistent.plenivo.de

upstream sprachassistent_api {
  server 127.0.0.1:3020;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name sprachassistent.plenivo.de;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name sprachassistent.plenivo.de;

  ssl_certificate     /etc/letsencrypt/live/sprachassistent.plenivo.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sprachassistent.plenivo.de/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;

  # Recordings are at most ~20 s (under 1 MB); WAV uploads for tests may be larger.
  client_max_body_size 12m;

  location / {
    include /etc/nginx/snippets/sprachassistent-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The reply is spoken sentence by sentence; buffering would hold it back until the end.
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://sprachassistent_api;
  }
}
