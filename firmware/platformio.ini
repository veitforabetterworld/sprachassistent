; ESP32-WROOM-32E mit INMP441 (Mikrofon) und MAX98357A (Verstaerker).
; Vor dem ersten Flashen: include/secrets.example.h nach include/secrets.h kopieren und ausfuellen.

[env:esp32dev]
; Arduino-Core 2.0.x, dort gibt es den I2S-Treiber driver/i2s.h
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=1
build_src_filter = +<*> -<hwtest.cpp> -<collect.cpp> -<motortest.cpp>
lib_ignore = esp-tflite-micro, esp-nn

; Gemeinsame Einstellungen fuer Firmware mit Wake Word (TFLite Micro, siehe src/wakeword.h).
; Vorher einmal: python tools/fetch_wakeword_libs.py
[wakeword]
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DTF_LITE_STATIC_MEMORY
  -DTF_LITE_DISABLE_X86_NEON
  -DESP_NN
  -I lib/esp-tflite-micro/third_party/flatbuffers/include
  -I lib/esp-tflite-micro/third_party/gemmlowp
  -I lib/esp-tflite-micro/third_party/ruy
  -I lib/esp-tflite-micro/third_party/kissfft
  -I lib/esp-nn/include
  -I lib/esp-nn/src/common
lib_deps = https://github.com/esphome-libs/esp-micro-speech-features.git#v1.2.3
lib_ldf_mode = deep+
; TFLM und Modell passen nicht mehr in 1,25 MB; min_spiffs hat 1,9 MB pro App (OTA bleibt moeglich)
board_build.partitions = min_spiffs.csv

; Hauptfirmware mit Wake Word "Giraffe" (Modell: src/wakeword_giraffe.h aus training/firmware_model.py)
[env:giraffe]
extends = env:esp32dev
build_unflags = ${wakeword.build_unflags}
build_flags = ${wakeword.build_flags} -DWAKEWORD_GIRAFFE
lib_ignore =
lib_deps = ${wakeword.lib_deps}
lib_ldf_mode = ${wakeword.lib_ldf_mode}
board_build.partitions = ${wakeword.board_build.partitions}

; Hauptfirmware mit Wake Word "Computer" (Modell: src/wakeword_computer.h)
[env:computer]
extends = env:esp32dev
build_unflags = ${wakeword.build_unflags}
build_flags = ${wakeword.build_flags} -DWAKEWORD_COMPUTER
lib_ignore =
lib_deps = ${wakeword.lib_deps}
lib_ldf_mode = ${wakeword.lib_ldf_mode}
board_build.partitions = ${wakeword.board_build.partitions}

; Hardware-Test ohne WLAN (Lautsprecher, Mikrofon, Taster): pio run -e hwtest -t upload
[env:hwtest]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<hwtest.cpp>

; Motor an GPIO 4: 1 s an, 2 s aus, endlos
[env:motortest]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<motortest.cpp>

; Aufnahmen fuer das Wake-Word-Training ueber USB, ohne WLAN: pio run -e collect -t upload
; Gegenstueck: training/record.py
[env:collect]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
build_src_filter = +<collect.cpp>
