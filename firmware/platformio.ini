; ESP32-WROOM-32E mit INMP441 (Mikrofon) und MAX98357A (Verstaerker).
; Vor dem ersten Flashen: include/secrets.example.h nach include/secrets.h kopieren und ausfuellen.
;   pio run -t upload            Wake Word "Giraffe" und Taster
;   pio run -e taster -t upload  nur Taster
;   pio run -e hwtest -t upload  Hardware-Test ohne WLAN (Mikrofon, Lautsprecher, Taster, Motor)

[platformio]
default_envs = giraffe

[env]
; Arduino-Core 2.0.x, dort gibt es den I2S-Treiber driver/i2s.h
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Hauptfirmware ohne Wake Word
[env:taster]
build_flags = -DCORE_DEBUG_LEVEL=1
build_src_filter = +<*> -<hwtest.cpp> -<collect.cpp>
lib_ignore = esp-tflite-micro, esp-nn

; Hauptfirmware mit Wake Word (TFLite Micro). Jedes Wort ist ein Env mit custom_wakeword = <wort>,
; das Modell liegt in wakewords/<wort>.h. training/train.py legt beides an.
[wakeword]
build_src_filter = ${env:taster.build_src_filter}
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DWAKEWORD
  -DTF_LITE_STATIC_MEMORY
  -DTF_LITE_DISABLE_X86_NEON
  -DESP_NN
  -I lib/esp-tflite-micro/third_party/flatbuffers/include
  -I lib/esp-tflite-micro/third_party/gemmlowp
  -I lib/esp-tflite-micro/third_party/ruy
  -I lib/esp-tflite-micro/third_party/kissfft
  -I lib/esp-nn/include
  -I lib/esp-nn/src/common
; holt TFLite Micro und esp-nn nach lib/ und bindet das Modell ein
extra_scripts = pre:tools/wakeword.py
lib_deps = https://github.com/esphome-libs/esp-micro-speech-features.git#v1.2.3
lib_ldf_mode = deep+
; TFLM und Modell passen nicht in 1,25 MB; min_spiffs hat 1,9 MB pro App (OTA bleibt moeglich)
board_build.partitions = min_spiffs.csv

[env:giraffe]
extends = wakeword
custom_wakeword = giraffe

[env:hwtest]
build_src_filter = +<hwtest.cpp>

; Aufnahmen fuer das Wake-Word-Training ueber USB, ohne WLAN; Gegenstueck: training/record.py
[env:collect]
monitor_speed = 921600
build_src_filter = +<collect.cpp>
