  <text x="438" y="539" text-anchor="end" font-weight="bold">Taster</text>

  <!-- ===== ESP32 DevKit (38 Pins) ===== -->
  <text x="660" y="52" text-anchor="middle" font-weight="bold" font-size="15">ESP32 DevKit (WROOM-32E)</text>
  <rect x="560" y="64" width="200" height="530" rx="8" fill="#1f3b63" stroke="#12243d" stroke-width="2"/>
