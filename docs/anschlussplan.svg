  <!-- ===== Hinweise ===== -->
  <g fill="#333333" font-size="13">
    <text x="24" y="660">• L/R und GND des Mikrofons beide an GND (linker Kanal). Alle GND-Pins sind miteinander verbunden.</text>
    <text x="24" y="680">• VIN des Verstärkers an 5V (bei 30-Pin-Boards heißt der Pin VIN). Mikrofon nur an 3V3, nicht an 5V!</text>
    <text x="24" y="700">• Die Pin-Reihenfolge auf deinen Platinen kann abweichen: immer nach der aufgedruckten Beschriftung löten.</text>
  </g>
</svg>
