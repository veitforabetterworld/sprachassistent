  <rect x="140" y="58" width="150" height="140" rx="6" fill="#2f7d46" stroke="#1e5530" stroke-width="2"/>
  <circle cx="180" cy="128" r="16" fill="#c9c9c9" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="180" cy="128" r="4" fill="#555555"/>
  <g fill="#ffffff" text-anchor="end">
