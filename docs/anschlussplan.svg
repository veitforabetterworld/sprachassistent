    <text x="266" y="104">L/R</text>
    <text x="266" y="124">VDD</text>
    <text x="266" y="144">SD</text>
    <text x="266" y="164">SCK</text>
    <text x="266" y="184">WS</text>
  </g>
  <g fill="#e8c55a" stroke="#8a6d10" stroke-width="1.5">
