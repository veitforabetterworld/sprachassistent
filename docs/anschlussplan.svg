  <!-- ===== Hinweise ===== -->
  <g fill="#333333" font-size="13">
    <text x="24" y="700">• L/R und GND des Mikrofons beide an GND (linker Kanal). Alle GND-Pins sind miteinander verbunden.</text>
    <text x="24" y="720">• VIN des Verstärkers an 5V (bei 30-Pin-Boards heißt der Pin VIN). Mikrofon nur an 3V3, nicht an 5V!</text>
    <text x="24" y="740">• Motor: Logic-Level-MOSFET (z. B. IRLZ44N), Diode 1N5819 oder 1N4007 mit dem Ring an 5V. Den Motor direkt anlöten, die Elektronik der Giraffe abklemmen.</text>
    <text x="24" y="760">• Die Pin-Reihenfolge auf deinen Platinen kann abweichen: immer nach der aufgedruckten Beschriftung löten.</text>
  </g>
</svg>
