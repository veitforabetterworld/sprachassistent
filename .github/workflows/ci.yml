name: CI

on:
  push:
    branches: [development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Without whisper/piper: no C++ build needed, the API runs against fakes.
      - run: cargo fmt --check
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features

  build-pi:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/cargo-registry
            target
          key: pi-${{ hashFiles('Cargo.lock', 'deployments/build/Dockerfile') }}
          restore-keys: pi-
      - name: Cross-compile for the Raspberry Pi
        run: |
          docker build -t sprachassistent-build deployments/build
          mkdir -p ~/cargo-registry
          docker run --rm -v "$PWD:/src" -v ~/cargo-registry:/usr/local/cargo/registry sprachassistent-build
          sudo chown -R "$(id -u):$(id -g)" target bin ~/cargo-registry
      - uses: actions/upload-artifact@v4
        with:
          name: sprachassistent-aarch64
          path: bin/
