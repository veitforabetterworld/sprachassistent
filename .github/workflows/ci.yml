name: CI

on:
  push:
    branches: [development]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Without the speech feature: no sherpa-onnx download needed, the API runs against fakes and a real Postgres.
      - run: cargo fmt --check
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:deps
      - name: Typecheck (incl. no-custom-css, i18n, error codes, page size)
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - run: pnpm build
      - name: Submodule pins
        run: pnpm check:submodules
      - name: Secrets
        run: pnpm check:secrets
      - name: Audit
        run: pnpm check:audit

  build-pi:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/cargo-registry
            ~/sherpa-cache
            target
          key: pi-v2-${{ hashFiles('Cargo.lock', 'deployments/build/Dockerfile') }}
          restore-keys: pi-v2-
      - name: Cross-compile for the Raspberry Pi
        run: |
          docker build -t sprachassistent-build deployments/build
          mkdir -p ~/cargo-registry ~/sherpa-cache
          docker run --rm -v "$PWD:/src" -v ~/cargo-registry:/usr/local/cargo/registry \
            -v ~/sherpa-cache:/root/.cache sprachassistent-build
          sudo chown -R "$(id -u):$(id -g)" target bin ~/cargo-registry ~/sherpa-cache
      - uses: actions/upload-artifact@v4
        with:
          name: sprachassistent-aarch64
          path: bin/
